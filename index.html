<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>タガログ学習アプリ</title>

  <link rel="manifest" href="manifest.json">

  <style>

    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 80px;
      background: #f5f5f5;
    }

    .word {
       font-size: min(10vw, 72px);
       margin-bottom: 20px;
       white-space: nowrap;
    }

    .meaning {
      font-size: 30px;
      color: gray;
      margin-bottom: 20px;
    }

    button {
      font-size: 18px;
      margin: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
    }

    /* 横並びボタン */
    .button-row {
       display: flex;
       justify-content: center;
       gap: 10px;
     }

       .button-row button {
        height: 90px;
       }

       .meaning-btn {
        width: 150px;
        line-height: 1.3;
     }

       .small-btn {
        width: 90px; 
     }

    #study {
      padding: 20px;
    }

    /* スマホ用 */
    @media screen and (max-width: 600px) {

      body {
        margin-top: 30px;
        padding: 10px;
      }

      h1 {
        font-size: 28px;
      }

      .word {
        font-size: 42px;
      }

      .meaning {
        font-size: 28px;
      }

      button {
        font-size: 22px;
        padding: 16px;
      }

    }

  </style>
</head>

<body>

<!-- ===================== -->
<!-- ホーム画面 -->
<!-- ===================== -->

<div id="home">

  <h1>ジャンルを選んでください</h1>

  <button onclick="startStudy('greeting')">挨拶</button>
  <button onclick="startStudy('eating')">食事</button>
  <button onclick="startStudy('responding')">一言返事</button>
  <button onclick="startStudy('daily')">日常</button>
  <button onclick="startStudy('coming')">coming soon</button>

</div>

<!-- ===================== -->
<!-- 学習画面 -->
<!-- ===================== -->

<div id="study" style="display:none;">

  <div class="word" id="word">---</div>

  <div class="meaning" id="meaning">???</div>

  <!-- 横並び -->
  <div class="button-row">

    <button class="small-btn" onclick="prevWord()">前へ</button>

    <button class="meaning-btn" onclick="showMeaning()"> 意味を<br>見る</button>

    <button class="small-btn" onclick="nextWord()">次へ</button>

  </div>

  <br><br>

  <button onclick="goHome()">← ホームに戻る</button>

</div>

<script>

const wordSets = {
  greeting: [
{ word: "Magandang umaga", meaning: "おはよう" },
{ word: "Magandang hapon", meaning: "こんにちは" },
{ word: "Magandang gabi ", meaning: "おやすみ" },
{ word: "Kumusta?", meaning: "元気？" },
{ word: "Kumusta ka ba?", meaning: "あなた元気？" },
{ word: "Mabuti ako", meaning: "私元気" },
{ word: "Antok ako", meaning: "私ねむい" },
{ word: "Hindi ako antok", meaning: "私ねむくない" },
{ word: "Hindi (pa) ako antok", meaning: "私(まだ)眠くない" },
{ word: "Antok ka ba", meaning: "あなたねむい？" },
{ word: "Tulog ka na", meaning: "もう寝てね/おやすみ" },
{ word: "ingat po", meaning: "take care" }

  ],

  eating: [
{ word: "Masarap", meaning: "おいしい" },
{ word: "Mukhang Masarap", meaning: "おいしそう" },
{ word: "Salamat po sa pagkain", meaning: "ごちそうさま" },
{ word: "pagkain", meaning: "食事/食べ物" },
{ word: "Salamat po panginoon", meaning: "主よ感謝します" },
{ word: "panginoon", meaning: "主/Lord" },
{ word: "Gutom", meaning: "お腹すいた" },
{ word: "Gutom (na) ako", meaning: "私は(もう)お腹すいた" },
{ word: "Gutom ako", meaning: "私お腹すいた" },
{ word: "Hindi ako gutom", meaning: "私お腹すいてない" },
{ word: "Hindi (pa) ako gutom", meaning: "私(まだ)お腹すいてない" }
  ],

  responding: [
{ word: "Oo/Opo", meaning: "yes" },
{ word: "Hindi/Hindi po", meaning: "no" },
{ word: "Wala", meaning: "ない/いない" },
{ word: "Sige", meaning: "ok 了解" },
{ word: "Salamat", meaning: "ありがとう" },
{ word: "Walang anoman", meaning: "どういたしまして" },
{ word: "ingat po", meaning: "take care" },
{ word: "Bakit", meaning: "Why" },
{ word: "Sigurado ka ba?", meaning: "Are you sure?" },
{ word: "Aray", meaning: "ouch" },
{ word: "Bilis", meaning: "hurry up" },
{ word: "Tara", meaning: "let’s go" },
{ word: "Tama", meaning: "correct/truth" },
{ word: "Mali", meaning: "incorrect/forlth" },
{ word: "Konti", meaning: "a bit" }
  ],

  daily: [
{ word: "Ano yan", meaning: "what is that?" },
{ word: "pasalubong", meaning: "お土産" },
{ word: "Salamat", meaning: "ありがとう" },
{ word: "Walang anoman", meaning: "どういたしまして" },
{ word: "Pogi", meaning: "Kamu" },
{ word: "Pogi ka", meaning: "あなたかっこいい" },
{ word: "Maganda", meaning: "Raquel" },
{ word: "Maganda ka", meaning: "あなたかわいい" },
{ word: "siempre", meaning: "もちろん/いつも/ずっと" },
{ word: "panget", meaning: "ugly" },
{ word: "baliw", meaning: "crazy" },
{ word: "panget ka", meaning: "you are ugly" },
{ word: "Salamat po panginoon", meaning: "主よ感謝します" },
{ word: "panginoon", meaning: "主/Lord" },
{ word: "kapitbahay", meaning: "neighborhood" }
 ],

  coming: [
{ word: "coming soon", meaning: "工事中" }
  ]

};

let currentSet = [];
let index = 0;

// =====================
// ホーム → 学習開始
// =====================
function startStudy(name) {

  currentSet = wordSets[name];

  index = 0;

  document.getElementById("home").style.display = "none";

  document.getElementById("study").style.display = "block";

  showWord();
}

// =====================
// ホームに戻る
// =====================

function goHome() {

  document.getElementById("home").style.display = "block";

  document.getElementById("study").style.display = "none";
}

// =====================
// 単語表示
// =====================

function showWord() {

  document.getElementById("word").textContent =
    currentSet[index].word;

  document.getElementById("meaning").textContent = "???";
}

// =====================
// 意味表示
// =====================

function showMeaning() {

  document.getElementById("meaning").textContent =
    currentSet[index].meaning;
}

// =====================
// 前へ
// =====================

function prevWord() {

  index =
    (index - 1 + currentSet.length)
    % currentSet.length;

  showWord();
}

// =====================
// 次へ
// =====================

function nextWord() {

  index =
    (index + 1)
    % currentSet.length;

  showWord();
}

</script>

</body>
</html>
